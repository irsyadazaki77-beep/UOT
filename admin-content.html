<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Management System — Universe of Tech Admin</title>
    <meta name="description" content="Dashboard Pengelolaan Konten dan Diagnostic Engine Universe of Tech">
    <link rel="stylesheet" href="tokens.css">
    <script src="theme-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="content-engine.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- Top Navigation -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-lg text-white shadow-lg shadow-indigo-500/30">
                    U
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Content Management Engine</h1>
                    <p class="text-xs text-slate-400">FASE 13 — Authoring & Diagnostic Dashboard</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <input id="adminKeyInput" type="password" placeholder="Server Admin Key (x-admin-key)..." 
                       class="px-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-200 focus:outline-none focus:border-indigo-500 w-64">
                <button onclick="checkAdminAccess()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-lg text-white transition-colors">
                    <i class="fa-solid fa-key mr-1"></i> Otentikasi Admin
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 py-6">

        <!-- Status & Diagnostic Banner -->
        <div id="diagnosticBanner" class="mb-6 p-4 rounded-xl bg-slate-800 border border-slate-700 hidden">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="auditStatusIcon" class="w-8 h-8 rounded-lg flex items-center justify-center text-sm"></div>
                    <div>
                        <h2 id="auditTitle" class="font-bold text-sm text-slate-100">Status Diagnostik Konten</h2>
                        <p id="auditSubtitle" class="text-xs text-slate-400">Sedang memverifikasi skema data...</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="runAuditCheck()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-medium rounded-lg transition">
                        <i class="fa-solid fa-rotate mr-1"></i> Uji Ulang
                    </button>
                    <button onclick="exportContentBundle()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-medium rounded-lg text-white transition">
                        <i class="fa-solid fa-download mr-1"></i> Export JSON
                    </button>
                    <label class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-xs font-medium rounded-lg text-white transition cursor-pointer">
                        <i class="fa-solid fa-upload mr-1"></i> Import JSON
                        <input type="file" id="importFileInput" onchange="importContentBundle(event)" class="hidden" accept=".json">
                    </label>
                </div>
            </div>
            <div id="auditErrorList" class="mt-3 text-xs space-y-1 font-mono text-amber-300 hidden"></div>
        </div>

        <!-- Domain Tabs -->
        <div class="flex items-center justify-between border-b border-slate-800 mb-6 pb-2">
            <div class="flex gap-2">
                <button onclick="switchTab('quizzes')" id="tab-quizzes" class="tab-btn px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white">
                    <i class="fa-solid fa-circle-question mr-1.5"></i> Quiz Bank
                </button>
                <button onclick="switchTab('lessons')" id="tab-lessons" class="tab-btn px-4 py-2 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800">
                    <i class="fa-solid fa-book-open mr-1.5"></i> Lessons & Materi
                </button>
                <button onclick="switchTab('projects')" id="tab-projects" class="tab-btn px-4 py-2 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800">
                    <i class="fa-solid fa-code mr-1.5"></i> Projects
                </button>
            </div>

            <div class="flex items-center gap-3">
                <select id="statusFilter" onchange="renderActiveTab()" class="px-3 py-1.5 bg-slate-800 border border-slate-700 text-xs rounded-lg focus:outline-none">
                    <option value="all">Semua Status (Draft + Published)</option>
                    <option value="published">Hanya Published</option>
                    <option value="draft">Hanya Draft</option>
                </select>
                <button onclick="openEditorModal()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-lg text-white transition">
                    <i class="fa-solid fa-plus mr-1"></i> Tambah Item Baru
                </button>
            </div>
        </div>

        <!-- Content Items Table -->
        <div id="contentTableContainer" class="bg-slate-800/60 border border-slate-700/80 rounded-xl overflow-hidden shadow-xl">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-slate-900/80 border-b border-slate-700 text-slate-400 text-xs uppercase">
                        <th class="p-3 font-semibold">ID</th>
                        <th class="p-3 font-semibold">Judul / Pertanyaan</th>
                        <th class="p-3 font-semibold">Skills / Topik</th>
                        <th class="p-3 font-semibold">Kesulitan</th>
                        <th class="p-3 font-semibold">Status</th>
                        <th class="p-3 font-semibold text-right">Aksi</th>
                    </tr>
                </thead>
                <tbody id="contentTableBody" class="divide-y divide-slate-800 text-slate-200">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="editorModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
                <h3 id="editorModalTitle" class="font-bold text-slate-100">Tambah Konten Baru</h3>
                <button onclick="closeEditorModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div class="p-6 overflow-y-auto space-y-4 text-xs">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold mb-1 text-slate-300">Domain Konten</label>
                        <select id="modalDomain" class="w-full p-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-200">
                            <option value="quizzes">Quiz / Bank Soal</option>
                            <option value="lessons">Lesson / Materi</option>
                            <option value="projects">Project / Tantangan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-300">ID Unik Konten (Stable ID)</label>
                        <input id="modalId" type="text" placeholder="e.g. quiz-js-01" class="w-full p-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-200">
                    </div>
                </div>

                <div>
                    <label id="modalTitleLabel" class="block font-semibold mb-1 text-slate-300">Judul atau Pertanyaan</label>
                    <textarea id="modalTitleInput" rows="3" placeholder="Tuliskan pertanyaan atau judul..." class="w-full p-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-200"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold mb-1 text-slate-300">Skills / Tag (pisahkan dengan koma)</label>
                        <input id="modalSkills" type="text" placeholder="javascript, DOM" class="w-full p-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-200">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-300">Tingkat Kesulitan</label>
                        <select id="modalDifficulty" class="w-full p-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-200">
                            <option value="easy">Easy (Dasar)</option>
                            <option value="medium">Medium (Sedang)</option>
                            <option value="hard">Hard (Sulit / HOTS)</option>
                        </select>
                    </div>
                </div>

                <!-- Quiz Specific Fields -->
                <div id="quizFields" class="space-y-3 p-3 bg-slate-800/50 border border-slate-700/60 rounded-xl">
                    <h4 class="font-bold text-indigo-400">Pilihan Jawaban (Quiz)</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <input id="opt0" type="text" placeholder="Opsi 0 (Jawaban A)" class="p-2 bg-slate-800 border border-slate-700 rounded-lg">
                        <input id="opt1" type="text" placeholder="Opsi 1 (Jawaban B)" class="p-2 bg-slate-800 border border-slate-700 rounded-lg">
                        <input id="opt2" type="text" placeholder="Opsi 2 (Jawaban C)" class="p-2 bg-slate-800 border border-slate-700 rounded-lg">
                        <input id="opt3" type="text" placeholder="Opsi 3 (Jawaban D)" class="p-2 bg-slate-800 border border-slate-700 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-300">Index Jawaban Benar (0 = A, 1 = B, 2 = C, 3 = D)</label>
                        <input id="correctIndex" type="number" min="0" max="3" value="0" class="w-24 p-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-200">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-slate-300">Penjelasan Pembahasan</label>
                        <textarea id="explanationInput" rows="2" placeholder="Penjelasan lengkap mengapa jawaban tersebut benar..." class="w-full p-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-200"></textarea>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input id="modalStatus" type="checkbox" class="w-4 h-4 rounded text-indigo-600 focus:ring-0 bg-slate-800 border-slate-700">
                        <span class="text-xs text-slate-300">Publish sekarang (Aktifkan untuk pengguna)</span>
                    </label>

                    <div id="validationErrorNotice" class="text-red-400 text-xs hidden font-medium"></div>
                </div>
            </div>

            <div class="p-4 bg-slate-950 border-t border-slate-800 flex justify-end gap-2">
                <button onclick="closeEditorModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg text-slate-300">Batal</button>
                <button onclick="saveContentItem()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-bold rounded-lg text-white transition">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Konten
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'quizzes';
        let adminKey = localStorage.getItem('uot_admin_key') || '';

        document.addEventListener('DOMContentLoaded', () => {
            if (adminKey) {
                document.getElementById('adminKeyInput').value = adminKey;
            }
            loadContentFromAPI();
        });

        function checkAdminAccess() {
            const inputKey = document.getElementById('adminKeyInput').value.trim();
            adminKey = inputKey;
            localStorage.setItem('uot_admin_key', adminKey);
            loadContentFromAPI();
        }

        async function loadContentFromAPI() {
            try {
                const headers = {};
                if (adminKey) headers['x-admin-key'] = adminKey;

                const res = await fetch('/api/admin/content', { headers });
                if (res.ok) {
                    const data = await res.json();
                    if (data.content) {
                        ContentEngine.importBundle(data.content);
                    }
                    if (data.audit) {
                        displayAuditReport(data.audit);
                    }
                } else {
                    // Fallback to public endpoint
                    const pubRes = await fetch('/api/content/all');
                    if (pubRes.ok) {
                        const pubData = await pubRes.json();
                        if (pubData.content) {
                            ContentEngine.importBundle(pubData.content);
                        }
                    }
                }
            } catch (e) {
                console.warn("Offline or API unavailable, using local ContentEngine cache.");
            }
            renderActiveTab();
            runAuditCheck();
        }

        function runAuditCheck() {
            const report = ContentEngine.validateAll();
            displayAuditReport(report);
        }

        function displayAuditReport(report) {
            const banner = document.getElementById('diagnosticBanner');
            const icon = document.getElementById('auditStatusIcon');
            const title = document.getElementById('auditTitle');
            const subtitle = document.getElementById('auditSubtitle');
            const errList = document.getElementById('auditErrorList');

            banner.classList.remove('hidden');

            if (report.valid) {
                icon.className = "w-8 h-8 rounded-lg flex items-center justify-center text-sm bg-emerald-500/20 text-emerald-400";
                icon.innerHTML = '<i class="fa-solid fa-check"></i>';
                title.textContent = `Pemeriksaan Konten Lulus (${report.totalItems} Items)`;
                subtitle.textContent = "Semua skema valid, ID unik, tidak ada kesalahan referensi atau jawaban hilang.";
                errList.classList.add('hidden');
            } else {
                icon.className = "w-8 h-8 rounded-lg flex items-center justify-center text-sm bg-red-500/20 text-red-400";
                icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
                title.textContent = `Ditemukan ${report.errors.length} Masalah Konten`;
                subtitle.textContent = "Mohon perbaiki item bernilai invalid sebelum mempublikasikan.";
                
                errList.innerHTML = report.errors.map(err => `<div>• ${err}</div>`).join('');
                errList.classList.remove('hidden');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2 text-sm font-medium rounded-lg text-slate-400 hover:bg-slate-800";
            });
            document.getElementById(`tab-${tab}`).className = "tab-btn px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white";
            
            const quizFields = document.getElementById('quizFields');
            if (tab === 'quizzes') {
                quizFields.classList.remove('hidden');
            } else {
                quizFields.classList.add('hidden');
            }

            renderActiveTab();
        }

        function renderActiveTab() {
            const filter = document.getElementById('statusFilter').value;
            const items = ContentEngine.getAll(currentTab, { includeDrafts: true });
            const tbody = document.getElementById('contentTableBody');

            const filtered = items.filter(item => {
                if (filter === 'published') return item.status === 'published';
                if (filter === 'draft') return item.status === 'draft';
                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">Tidak ada item ditemukan.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(item => {
                const titleOrQ = item.title || item.question || item.id;
                const skillsList = Array.isArray(item.skills) ? item.skills.join(', ') : (item.category || '-');
                const isPub = item.status === 'published';

                return `
                    <tr class="hover:bg-slate-800/40 transition-colors">
                        <td class="p-3 font-mono text-xs text-indigo-300">${item.id}</td>
                        <td class="p-3 font-medium text-slate-200 max-w-xs truncate">${titleOrQ}</td>
                        <td class="p-3 text-xs text-slate-400">${skillsList}</td>
                        <td class="p-3 text-xs text-slate-400">${item.difficulty || '-'}</td>
                        <td class="p-3 text-xs">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${isPub ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                ${isPub ? 'Published' : 'Draft'}
                            </span>
                        </td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="togglePublishStatus('${currentTab}', '${item.id}', '${isPub ? 'draft' : 'published'}')" class="text-xs text-slate-400 hover:text-white">
                                <i class="fa-solid ${isPub ? 'fa-eye-slash' : 'fa-eye'}"></i>
                            </button>
                            <button onclick="editItem('${currentTab}', '${item.id}')" class="text-xs text-indigo-400 hover:text-indigo-300">
                                <i class="fa-solid fa-pen"></i> Edit
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function togglePublishStatus(domain, id, newStatus) {
            try {
                const res = await fetch('/api/admin/content/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey, 'X-Requested-With': 'XMLHttpRequest' },
                    body: JSON.stringify({ domain, id, status: newStatus })
                });
                if (res.ok) {
                    loadContentFromAPI();
                } else {
                    const data = await res.json();
                    alert(data.message || "Gagal mengubah status.");
                }
            } catch (e) {
                alert("Gagal terhubung ke server admin API.");
            }
        }

        function openEditorModal() {
            document.getElementById('editorModalTitle').textContent = "Tambah Konten Baru";
            document.getElementById('modalDomain').value = currentTab;
            document.getElementById('modalId').value = `${currentTab.slice(0, -1)}-${Date.now().toString(36)}`;
            document.getElementById('modalTitleInput').value = "";
            document.getElementById('modalSkills').value = "";
            document.getElementById('modalDifficulty').value = "easy";
            document.getElementById('opt0').value = "";
            document.getElementById('opt1').value = "";
            document.getElementById('opt2').value = "";
            document.getElementById('opt3').value = "";
            document.getElementById('correctIndex').value = "0";
            document.getElementById('explanationInput').value = "";
            document.getElementById('modalStatus').checked = true;
            document.getElementById('validationErrorNotice').classList.add('hidden');

            document.getElementById('editorModal').classList.remove('hidden');
        }

        function closeEditorModal() {
            document.getElementById('editorModal').classList.add('hidden');
        }

        function editItem(domain, id) {
            let item = null;
            if (domain === 'quizzes') item = ContentEngine.getQuiz(id);
            else if (domain === 'lessons') item = ContentEngine.getLesson(id);
            else if (domain === 'projects') item = ContentEngine.getProject(id);

            if (!item) return;

            document.getElementById('editorModalTitle').textContent = `Edit Konten (${item.id})`;
            document.getElementById('modalDomain').value = domain;
            document.getElementById('modalId').value = item.id;
            document.getElementById('modalTitleInput').value = item.title || item.question || "";
            document.getElementById('modalSkills').value = Array.isArray(item.skills) ? item.skills.join(', ') : (item.category || "");
            document.getElementById('modalDifficulty').value = item.difficulty || "easy";
            
            if (domain === 'quizzes' && Array.isArray(item.options)) {
                document.getElementById('opt0').value = item.options[0] || "";
                document.getElementById('opt1').value = item.options[1] || "";
                document.getElementById('opt2').value = item.options[2] || "";
                document.getElementById('opt3').value = item.options[3] || "";
                document.getElementById('correctIndex').value = item.correctAnswer !== undefined ? item.correctAnswer : 0;
                document.getElementById('explanationInput').value = item.explanation || "";
            }

            document.getElementById('modalStatus').checked = item.status === 'published';
            document.getElementById('validationErrorNotice').classList.add('hidden');
            document.getElementById('editorModal').classList.remove('hidden');
        }

        async function getCsrfTokenHeader() {
            let csrfToken = document.cookie.split('; ').find(row => row.startsWith('uot_csrf='))?.split('=')[1];
            if (!csrfToken) {
                try {
                    const r = await fetch('/api/csrf-token');
                    const d = await r.json();
                    csrfToken = d.csrfToken;
                } catch (_) {}
            }
            return csrfToken || '';
        }

        async function saveContentItem() {
            const domain = document.getElementById('modalDomain').value;
            const id = document.getElementById('modalId').value.trim();
            const titleOrQ = document.getElementById('modalTitleInput').value.trim();
            const skillsRaw = document.getElementById('modalSkills').value.trim();
            const difficulty = document.getElementById('modalDifficulty').value;
            const isPub = document.getElementById('modalStatus').checked;

            const skills = skillsRaw ? skillsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

            let item = {
                id,
                skills,
                difficulty,
                status: isPub ? 'published' : 'draft',
                version: 1
            };

            if (domain === 'quizzes') {
                item.question = titleOrQ;
                const opts = [
                    document.getElementById('opt0').value.trim(),
                    document.getElementById('opt1').value.trim(),
                    document.getElementById('opt2').value.trim(),
                    document.getElementById('opt3').value.trim()
                ].filter(Boolean);
                item.options = opts;
                item.correctAnswer = parseInt(document.getElementById('correctIndex').value, 10);
                item.explanation = document.getElementById('explanationInput').value.trim();
            } else if (domain === 'lessons') {
                item.title = titleOrQ;
                item.description = titleOrQ;
                item.contentBlocks = [{ type: 'html', data: titleOrQ }];
            } else if (domain === 'projects') {
                item.title = titleOrQ;
                item.objectives = [titleOrQ];
            }

            // Client Validation Check
            let validation = { valid: true, errors: [] };
            if (domain === 'quizzes') validation = ContentEngine.validateQuiz(item);
            else if (domain === 'lessons') validation = ContentEngine.validateLesson(item);
            else if (domain === 'projects') validation = ContentEngine.validateProject(item);

            if (!validation.valid) {
                const notice = document.getElementById('validationErrorNotice');
                notice.textContent = validation.errors.join(' | ');
                notice.classList.remove('hidden');
                return;
            }

            try {
                const csrfToken = await getCsrfTokenHeader();
                const res = await fetch('/api/admin/content/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey, 'x-csrf-token': csrfToken },
                    body: JSON.stringify({ domain, item })
                });

                if (res.ok) {
                    closeEditorModal();
                    loadContentFromAPI();
                } else {
                    const data = await res.json();
                    alert(data.message || "Gagal menyimpan konten ke server.");
                }
            } catch (e) {
                // Offline fallback save to local engine
                ContentEngine.registerContent(domain, [item]);
                closeEditorModal();
                renderActiveTab();
                runAuditCheck();
            }
        }

        function exportContentBundle() {
            const bundle = ContentEngine.exportAll();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bundle, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `uot-content-export-${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        async function importContentBundle(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const bundle = JSON.parse(e.target.result);
                    const csrfToken = await getCsrfTokenHeader();
                    const res = await fetch('/api/admin/content/import', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-admin-key': adminKey, 'x-csrf-token': csrfToken },
                        body: JSON.stringify({ bundle })
                    });
                    if (res.ok) {
                        alert("Berhasil mengimpor konten!");
                        loadContentFromAPI();
                    } else {
                        // Local import fallback
                        ContentEngine.importBundle(bundle);
                        renderActiveTab();
                        runAuditCheck();
                    }
                } catch (err) {
                    alert("Format JSON file tidak valid.");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
