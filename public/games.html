<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Tantangan & Minigame Interaktif | Universe of Tech</title>
    <meta name="description" content="Uji kemampuan logika coding dan pemahaman budaya nusantara lewat mini game interaktif berjenjang.">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="app-shell.css">
    <link rel="stylesheet" href="navbar-explore.css">
    <link rel="stylesheet" href="navbar-shared.css">
    <link rel="stylesheet" href="games/games.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
</head>
<body data-page="games">
    <header class="uot-navbar" id="mainNavbar">
        <div class="uot-nav-container">
            <a href="index.html" class="uot-nav-brand" aria-label="Universe of Tech Beranda">
                <img src="logo.png" alt="Logo UOT" class="uot-nav-logo" width="36" height="36">
                <span class="uot-nav-brand-text">Universe of Tech</span>
            </a>
            <nav class="uot-nav-links" aria-label="Navigasi Utama">
                <a href="index.html" class="uot-nav-link"><i class="fa-solid fa-house"></i> Beranda</a>
                <a href="learning-path.html" class="uot-nav-link"><i class="fa-solid fa-route"></i> Jalur Belajar</a>
                <a href="quiz.html" class="uot-nav-link"><i class="fa-solid fa-brain"></i> Kuis</a>
                <a href="games.html" class="uot-nav-link active"><i class="fa-solid fa-gamepad"></i> Arena Game</a>
                <a href="bahasa-daerah.html" class="uot-nav-link"><i class="fa-solid fa-earth-asia"></i> Budaya</a>
                <a href="projects.html" class="uot-nav-link"><i class="fa-solid fa-laptop-code"></i> Proyek</a>
            </nav>
        </div>
    </header>

    <main class="game-arena-container" id="gameContainer">
        <header class="game-arena-header">
            <h1 class="game-arena-title">Arena Tantangan & Minigame</h1>
            <p class="game-arena-subtitle">Asah ketajaman logika pemrograman dan kekayaan budaya Nusantara lewat simulasi interaktif tanpa double-XP farming.</p>
        </header>

        <!-- Category Tabs -->
        <nav class="game-tabs-nav" aria-label="Pilihan Kategori Game">
            <button class="game-tab-btn active" data-game="matching" type="button">
                <i class="fa-solid fa-table-cells-large"></i> Cocokkan Kartu
            </button>
            <button class="game-tab-btn" data-game="hunt" type="button">
                <i class="fa-solid fa-compass"></i> Jejak Petunjuk
            </button>
            <button class="game-tab-btn" data-game="voice" type="button">
                <i class="fa-solid fa-microphone"></i> Latihan Pelafalan
            </button>
            <button class="game-tab-btn" data-game="audio" type="button">
                <i class="fa-solid fa-volume-high"></i> Simak Audio
            </button>
            <button class="game-tab-btn" data-game="syntax" type="button">
                <i class="fa-solid fa-code"></i> Susun Kode
            </button>
        </nav>

        <!-- Game Controls Bar -->
        <section class="game-controls-bar" aria-label="Pengaturan Game">
            <div class="difficulty-group" role="group" aria-label="Pilih Tingkat Kesulitan">
                <span class="stat-label" style="margin-right:4px;">Tingkat:</span>
                <button class="diff-btn" data-diff="easy" type="button">Mudah</button>
                <button class="diff-btn active" data-diff="normal" type="button">Standar</button>
                <button class="diff-btn" data-diff="hard" type="button">Tantangan</button>
            </div>
            <div>
                <label for="topicSelect" class="stat-label" style="margin-right:6px;">Topik:</label>
                <select id="topicSelect" class="topic-select" aria-label="Pilih Topik Materi"></select>
            </div>
        </section>

        <!-- Live Stats HUD -->
        <section class="game-stats-hud" aria-label="Statistik Sesi">
            <div class="stat-box">
                <span class="stat-label">Skor Berjalan</span>
                <span class="stat-value" id="hudScore">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Waktu Tersisa</span>
                <span class="stat-value" id="hudTimer">60s</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Skor Terbaik</span>
                <span class="stat-value" id="hudBest">0</span>
            </div>
        </section>

        <!-- Active Game Stage Area -->
        <section class="game-stage-card" id="gameStage" role="region" aria-live="polite">
            <div style="text-align:center; padding:40px; color:var(--game-muted);">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top:12px;">Memuat arena permainan...</p>
            </div>
        </section>
    </main>

    <script type="module" src="auth-helper.js" ></script>
    <script type="module" src="curriculum-data.js" ></script>
    <script type="module" src="progression-engine.js" ></script>
    <script type="module" src="sound-engine.js" ></script>
    <script type="module" src="games/game-core.js" ></script>
    <script type="module" src="games/matching-game.js" ></script>
    <script type="module" src="games/culture-hunt.js" ></script>
    <script type="module" src="games/pronunciation-game.js" ></script>
    <script type="module" src="games/audio-game.js" ></script>
    <script type="module" src="games/syntax-scramble.js" ></script>
    <script type="module" src="games/game-arena.js" ></script>
</body>
</html>
