<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https:;">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Membaca Buku - Universe Of Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="feature-pages.css">
    <link rel="stylesheet" href="nav-polish.css">
    <link rel="stylesheet" href="mobile-compat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Reset override to support immersive reader themes */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Ambient Orbs */
        .ambient-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.15;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .orb-blue {
            background: var(--blue);
            top: -50px;
            right: 10%;
        }
        .orb-green {
            background: var(--green);
            bottom: -50px;
            left: 10%;
        }

        /* Immersive Layout */
        .reader-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Fixed Header */
        .reader-header {
            height: 70px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--navbar-bg);
            backdrop-filter: blur(20px);
            z-index: 10;
            flex-shrink: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-center {
            text-align: center;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-center h1 {
            font-size: 16px;
            font-weight: 850;
            margin: 0;
            letter-spacing: -0.02em;
        }
        .header-center span {
            font-size: 11px;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Controls styling */
        .setting-btn {
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--dark);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .setting-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
            transform: translateY(-1px);
            box-shadow: var(--shadow-soft);
        }
        .setting-btn:active {
            transform: translateY(0);
        }
        
        .theme-select-row {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 99px;
            background: var(--white);
        }
        .theme-select-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.25s, border-color 0.25s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
        }
        .theme-select-btn:hover {
            transform: scale(1.15);
        }
        .theme-select-btn.active {
            border-color: var(--blue);
            transform: scale(1.08);
        }
        .theme-select-btn.theme-light { background: #ffffff; }
        .theme-select-btn.theme-sepia { background: #f4ecd8; }
        .theme-select-btn.theme-dark { background: #1e293b; }

        /* Main reader section */
        .reader-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar: Table of Contents */
        .reader-sidebar {
            width: 300px;
            border-right: 1px solid var(--border);
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            z-index: 5;
            transition: margin-left 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease, border-color 0.3s ease;
            flex-shrink: 0;
        }
        .reader-sidebar.collapsed {
            margin-left: -300px;
        }
        .sidebar-title {
            font-size: 11px;
            font-weight: 900;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: block;
        }
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chapter-item {
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 750;
            color: var(--muted);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.4;
            border: 1px solid transparent;
        }
        .chapter-item:hover {
            background: rgba(102, 112, 133, 0.06);
            color: var(--dark);
        }
        .chapter-item.active {
            background: linear-gradient(135deg, var(--green), var(--blue));
            color: white !important;
            border-color: transparent;
            box-shadow: 0 6px 16px rgba(50, 214, 107, 0.25);
        }

        /* Reading view area */
        .reader-main-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            position: relative;
            scroll-behavior: smooth;
        }
        .reading-sheet-container {
            flex: 1;
            padding: 48px 24px;
            display: flex;
            justify-content: center;
        }
        .reading-sheet {
            width: 100%;
            max-width: 740px;
            line-height: 1.85;
            font-family: 'Inter', Georgia, serif;
            letter-spacing: -0.01em;
            transition: font-size 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }
        /* Fade in content transition */
        .reading-sheet.fade-out {
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .reading-sheet.fade-in {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Typography sizing classes */
        .font-size-small {
            font-size: 15px;
        }
        .font-size-medium {
            font-size: 18px;
        }
        .font-size-large {
            font-size: 22px;
        }

        /* Book content element overrides */
        .reading-sheet h2 {
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: -0.04em;
            margin-bottom: 24px;
            line-height: 1.25;
            color: var(--dark);
        }
        .reading-sheet p {
            margin-bottom: 24px;
            color: inherit;
        }
        .reading-sheet ul, .reading-sheet ol {
            margin-bottom: 24px;
            padding-left: 24px;
        }
        .reading-sheet li {
            margin-bottom: 8px;
        }
        .reading-sheet code {
            font-family: SFMono-Regular, Consolas, Monaco, monospace;
            background: rgba(102, 112, 133, 0.08);
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 0.9em;
        }
        .reading-sheet pre {
            background: rgba(102, 112, 133, 0.05);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 16px;
            overflow-x: auto;
            margin: 24px 0;
            line-height: 1.5;
        }
        .reading-sheet pre code {
            background: transparent;
            padding: 0;
            font-size: 0.85em;
        }

        /* Bottom Pagination */
        .reader-footer {
            height: 80px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: var(--navbar-bg);
            backdrop-filter: blur(20px);
            z-index: 10;
            flex-shrink: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .footer-center {
            text-align: center;
        }
        .footer-progress-percent {
            font-weight: 850;
            font-size: 13.5px;
            color: var(--blue);
            display: block;
        }
        .footer-progress-pages {
            font-size: 11px;
            color: var(--muted);
            font-weight: 700;
        }

        /* ==========================================================================
           READING THEMES OVERRIDES
           ========================================================================== */
        
        /* Sepia Theme */
        body.read-theme-sepia {
            background-color: #f4ecd8 !important;
            color: #43301e !important;
        }
        body.read-theme-sepia .ambient-orb {
            opacity: 0.05;
        }
        body.read-theme-sepia .reader-header,
        body.read-theme-sepia .reader-footer {
            background-color: rgba(237, 226, 201, 0.9) !important;
            border-color: rgba(92, 68, 44, 0.12) !important;
        }
        body.read-theme-sepia .reader-sidebar {
            background-color: rgba(228, 215, 184, 0.9) !important;
            border-color: rgba(92, 68, 44, 0.12) !important;
        }
        body.read-theme-sepia .setting-btn,
        body.read-theme-sepia .theme-select-row {
            background-color: #f4ecd8 !important;
            color: #43301e !important;
            border-color: rgba(92, 68, 44, 0.18) !important;
        }
        body.read-theme-sepia .setting-btn:hover {
            border-color: var(--blue) !important;
            color: var(--blue) !important;
        }
        body.read-theme-sepia .chapter-item:not(.active) {
            color: #6d553d !important;
        }
        body.read-theme-sepia .chapter-item:hover:not(.active) {
            background-color: rgba(92, 68, 44, 0.07) !important;
            color: #43301e !important;
        }
        body.read-theme-sepia .reading-sheet h2 {
            color: #2e2013 !important;
        }
        body.read-theme-sepia .reading-sheet code {
            background: rgba(92, 68, 44, 0.08);
        }
        body.read-theme-sepia .reading-sheet pre {
            background: rgba(92, 68, 44, 0.04);
            border-color: rgba(92, 68, 44, 0.15);
        }

        /* Dark Theme */
        body.read-theme-dark {
            background-color: #0f172a !important;
            color: #e2e8f0 !important;
        }
        body.read-theme-dark .ambient-orb {
            opacity: 0.1;
        }
        body.read-theme-dark .reader-header,
        body.read-theme-dark .reader-footer {
            background-color: rgba(30, 41, 59, 0.9) !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
        }
        body.read-theme-dark .reader-sidebar {
            background-color: rgba(15, 23, 42, 0.95) !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
        }
        body.read-theme-dark .setting-btn,
        body.read-theme-dark .theme-select-row {
            background-color: #1e293b !important;
            color: #cbd5e1 !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
        }
        body.read-theme-dark .setting-btn:hover {
            border-color: var(--blue) !important;
            color: var(--blue) !important;
        }
        body.read-theme-dark .chapter-item:not(.active) {
            color: #94a3b8 !important;
        }
        body.read-theme-dark .chapter-item:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.04) !important;
            color: #f1f5f9 !important;
        }
        body.read-theme-dark .reading-sheet h2 {
            color: #ffffff !important;
        }
        body.read-theme-dark .reading-sheet code {
            background: rgba(255, 255, 255, 0.08);
        }
        body.read-theme-dark .reading-sheet pre {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.08);
        }

        /* Notes Sidebar */
        .reader-notes-sidebar {
            width: 320px;
            padding: 24px;
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            z-index: 5;
            flex-shrink: 0;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, background-color 0.3s ease;
        }
        .reader-notes-sidebar.collapsed {
            width: 0 !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            border-left: 0px solid transparent !important;
            overflow: hidden;
        }
        body.read-theme-sepia #readerNoteArea {
            background-color: #f4ecd8 !important;
            color: #43301e !important;
            border-color: rgba(92, 68, 44, 0.18) !important;
        }
        body.read-theme-dark #readerNoteArea {
            background-color: #1e293b !important;
            color: #cbd5e1 !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
        }
        .setting-btn.active {
            border-color: var(--blue) !important;
            color: white !important;
            background-color: var(--blue) !important;
        }

        /* Fullscreen hidden controls trigger */
        @media (max-width: 768px) {
            .reader-sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                box-shadow: 20px 0 50px rgba(0,0,0,0.15);
            }
            .reader-sidebar.collapsed {
                margin-left: -320px;
            }
            .reader-notes-sidebar {
                position: absolute;
                top: 0;
                bottom: 0;
                right: 0;
                box-shadow: -20px 0 50px rgba(0,0,0,0.15);
            }
            .reader-notes-sidebar.collapsed {
                margin-right: -340px;
            }
            .reader-header {
                padding: 0 16px;
            }
            .header-center {
                display: none; /* Hide center book title in mobile to fit controls */
            }
            .reader-footer {
                padding: 0 16px;
            }
            .setting-btn span {
                display: none; /* Hide texts on buttons for mobile */
            }
        }

        /* Text Highlighter (Stabilo) Mode */
        .reading-sheet p.highlighted {
            background-color: rgba(253, 224, 71, 0.4) !important;
            border-radius: 6px;
            padding: 4px 8px;
            box-shadow: 0 2px 8px rgba(253, 224, 71, 0.15);
        }
        body.read-theme-sepia .reading-sheet p.highlighted {
            background-color: rgba(217, 119, 6, 0.25) !important;
            box-shadow: 0 2px 8px rgba(217, 119, 6, 0.1);
        }
        body.read-theme-dark .reading-sheet p.highlighted {
            background-color: rgba(234, 179, 8, 0.25) !important;
            color: #ffffff !important;
            box-shadow: 0 2px 8px rgba(234, 179, 8, 0.1);
        }

        .highlighter-active .reading-sheet p {
            cursor: crosshair;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='%23eab308'><path d='M16 2l6 6L9 21H3v-6L16 2z'/></svg>") 2 22, pointer;
            transition: all 0.2s ease;
            border-left: 2px dashed transparent;
            padding-left: 8px;
        }
        .highlighter-active .reading-sheet p:hover {
            border-left-color: var(--blue);
            background-color: rgba(79, 140, 255, 0.05);
            border-radius: 0 6px 6px 0;
        }

        /* Interactive Mini-Quiz Style */
        .mini-quiz-card {
            margin-top: 48px;
            padding: 28px;
            border-radius: 20px;
            border: 1px dashed var(--border);
            background: var(--surface-2);
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
        }
        body.read-theme-sepia .mini-quiz-card {
            background: rgba(92, 68, 44, 0.04);
            border-color: rgba(92, 68, 44, 0.15);
        }
        body.read-theme-dark .mini-quiz-card {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.08);
        }
        
        .quiz-option-btn {
            box-sizing: border-box;
            text-align: left;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        body.read-theme-sepia .quiz-option-btn {
            background: #f4ecd8;
            border-color: rgba(92, 68, 44, 0.15);
            color: #43301e;
        }
        body.read-theme-dark .quiz-option-btn {
            background: #1e293b;
            border-color: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
        }

        .quiz-option-btn:hover:not(:disabled) {
            border-color: var(--blue);
            background: rgba(79, 140, 255, 0.05);
            transform: translateX(4px);
        }
        body.read-theme-sepia .quiz-option-btn:hover:not(:disabled) {
            background: rgba(92, 68, 44, 0.07);
        }
        body.read-theme-dark .quiz-option-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.04);
        }

        .quiz-option-btn.correct {
            background-color: rgba(50, 214, 107, 0.15) !important;
            border-color: var(--green) !important;
            color: var(--green) !important;
        }
        .quiz-option-btn.wrong {
            background-color: rgba(255, 79, 79, 0.15) !important;
            border-color: var(--danger) !important;
            color: var(--danger) !important;
        }
        .quiz-option-btn:disabled {
            cursor: default;
        }

        /* Zen Mode style */
        body.zen-active .reader-header,
        body.zen-active .reader-sidebar,
        body.zen-active .reader-notes-sidebar,
        body.zen-active #summaryDrawer,
        body.zen-active .reader-footer {
            display: none !important;
        }
        body.zen-active .reader-main-content {
            padding: 0 !important;
            margin: 0 !important;
            height: 100vh !important;
        }
        body.zen-active .reading-sheet-container {
            padding: 64px 24px !important;
        }

        /* Search highlights */
        mark.search-highlight {
            background-color: rgba(249, 115, 22, 0.4) !important;
            color: inherit;
            border-radius: 4px;
            padding: 2px 4px;
            transition: all 0.2s ease;
        }
        mark.search-highlight.active-match {
            background-color: var(--blue) !important;
            color: white !important;
            box-shadow: 0 0 10px rgba(79, 140, 255, 0.4);
        }

        /* Control Groups / Segmented Toolbars */
        .control-group {
            display: inline-flex;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--white);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .control-group .setting-btn {
            border: none;
            border-radius: 0;
            box-shadow: none;
            border-right: 1px solid var(--border);
            background: transparent;
            padding: 8px 14px;
        }
        .control-group .setting-btn:last-child {
            border-right: none;
        }
        .control-group .setting-btn:hover {
            background: rgba(79, 140, 255, 0.05);
            transform: none;
        }
        
        /* Theme overrides for control groups */
        body.read-theme-sepia .control-group {
            background-color: #f4ecd8 !important;
            border-color: rgba(92, 68, 44, 0.18) !important;
        }
        body.read-theme-sepia .control-group .setting-btn {
            color: #43301e !important;
            border-right-color: rgba(92, 68, 44, 0.18) !important;
        }
        body.read-theme-sepia .control-group .setting-btn:hover {
            background: rgba(92, 68, 44, 0.07) !important;
        }
        body.read-theme-dark .control-group {
            background-color: #1e293b !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
        }
        body.read-theme-dark .control-group .setting-btn {
            color: #cbd5e1 !important;
            border-right-color: rgba(255, 255, 255, 0.12) !important;
        }
        body.read-theme-dark .control-group .setting-btn:hover {
            background: rgba(255, 255, 255, 0.04) !important;
        }
    </style>
</head>

<body class="read-theme-light">
    <!-- Ambient Backdrop Effects -->
    <div class="ambient-orb orb-blue" id="orbBlue"></div>
    <div class="ambient-orb orb-green" id="orbGreen"></div>

    <div class="reader-layout">
        <!-- IMMERSIVE HEADER -->
        <header class="reader-header">
            <div class="header-left">
                <button class="setting-btn" id="backToLibrary" title="Kembali ke Perpustakaan">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Kembali</span>
                </button>
                <button class="setting-btn" id="toggleSidebar" title="Tampilkan/Sembunyikan Daftar Isi">
                    <i class="fa-solid fa-bars"></i>
                    <span>Daftar Isi</span>
                </button>
            </div>

            <div class="header-center">
                <span id="headerCategory">Category</span>
                <h1 id="headerBookTitle">Loading Book...</h1>
            </div>

            <div class="header-right">
                <!-- Group 1: Alat Baca / Utilities -->
                <div class="control-group">
                    <button class="setting-btn" id="ttsToggle" title="Dengarkan Audio (Text-to-Speech)">
                        <i class="fa-solid fa-volume-high"></i>
                        <span>Dengar</span>
                    </button>
                    <button class="setting-btn" id="highlighterToggle" title="Mode Stabilo Teks">
                        <i class="fa-solid fa-highlighter"></i>
                        <span>Stabilo</span>
                    </button>
                    <button class="setting-btn" id="searchToggle" title="Cari Kata Kunci">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Cari</span>
                    </button>
                    <button class="setting-btn" id="summaryToggle" title="Rangkuman Bab (Cheat Sheet)">
                        <i class="fa-solid fa-list-check"></i>
                        <span>Rangkuman</span>
                    </button>
                    <button class="setting-btn" id="zenToggle" title="Mode Fokus (Zen Mode)">
                        <i class="fa-solid fa-eye-slash"></i>
                        <span>Fokus</span>
                    </button>
                </div>

                <!-- Group 2: Font Controls -->
                <div class="control-group">
                    <button class="setting-btn" id="readerFontDec" title="Perkecil Font" style="font-size: 11px; font-weight: 800;">Aa-</button>
                    <button class="setting-btn" id="readerFontInc" title="Perbesar Font" style="font-size: 14px; font-weight: 800;">Aa+</button>
                </div>

                <!-- Theme Controls Row -->
                <div class="theme-select-row">
                    <button class="theme-select-btn theme-light active" data-read-theme="light" title="Tema Terang"></button>
                    <button class="theme-select-btn theme-sepia" data-read-theme="sepia" title="Tema Sepia"></button>
                    <button class="theme-select-btn theme-dark" data-read-theme="dark" title="Tema Gelap"></button>
                </div>

                <!-- Group 3: Notes & Fullscreen -->
                <div class="control-group">
                    <button class="setting-btn" id="toggleNotes" title="Tulis Catatan Belajar">
                        <i class="fa-solid fa-note-sticky"></i>
                        <span>Catatan</span>
                    </button>
                    <button class="setting-btn" id="fullscreenToggle" title="Mode Layar Penuh">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Scroll Progress Bar -->
        <div id="scrollProgressBar" style="position: absolute; top: 70px; left: 0; width: 0%; height: 3px; background: linear-gradient(90deg, var(--green), var(--blue)); z-index: 100; transition: width 0.1s ease;"></div>

        <!-- IMMERSIVE BODY -->
        <div class="reader-body">
            <!-- Table of Contents Sidebar -->
            <aside class="reader-sidebar" id="readerSidebar">
                <span class="sidebar-title">Daftar Isi Bab</span>
                <nav class="chapter-list" id="sidebarChapterList">
                    <!-- Populated dynamically by JS -->
                </nav>
            </aside>

            <!-- Focus reading page sheet -->
            <main class="reader-main-content" id="readerMainContent">
                <div class="reading-sheet-container">
                    <article class="reading-sheet font-size-medium" id="readingSheet">
                        <!-- Book Content dynamically rendered here -->
                    </article>
                </div>

                <!-- BOTTOM PAGINATION -->
                <footer class="reader-footer">
                    <button class="setting-btn" id="btnPrevChapter">
                        <i class="fa-solid fa-chevron-left"></i> Bab Sebelumnya
                    </button>
                    
                    <div class="footer-center">
                        <span class="footer-progress-percent" id="footerProgressPercent">Progress: 0% dibaca</span>
                        <span class="footer-progress-pages" id="footerProgressPages">Bab X dari Y</span>
                        <!-- Sisa Waktu Baca -->
                        <span id="readerTimeRemainingBadge" style="font-size: 11.5px; font-weight: 800; color: var(--muted); margin-top: 4px; display: block;">?? Sisa 0 menit</span>
                    </div>

                    <button class="setting-btn" id="btnNextChapter" style="background: var(--blue); color: white; border-color: transparent;">
                        Bab Berikutnya <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </footer>
            </main>
            
            <!-- Notes Sidebar Panel -->
            <aside class="reader-notes-sidebar collapsed" id="readerNotesSidebar">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span class="sidebar-title" style="margin-bottom: 0;">Catatan Belajar</span>
                    <span id="readerAutosaveStatus" style="font-size: 10px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; transition: opacity 0.3s ease; opacity: 0;"></span>
                </div>
                <textarea id="readerNoteArea" style="flex: 1; min-height: 200px; border: 1px solid var(--border); background: var(--white); color: var(--dark); border-radius: 16px; padding: 14px; outline: none; font-size: 13.5px; resize: none; line-height: 1.6; font-family: inherit;" placeholder="Tuliskan catatan atau rangkuman bab di sini... (Tersimpan otomatis)"></textarea>
            </aside>

            <!-- Summary Drawer Panel -->
            <aside class="reader-notes-sidebar collapsed" id="summaryDrawer">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span class="sidebar-title" style="margin-bottom: 0;"><i class="fa-solid fa-list-check" style="margin-right: 6px;"></i> Rangkuman Bab</span>
                    <button class="setting-btn" id="btnCloseSummary" style="padding: 6px 10px; border-radius: 8px; border-color: transparent; background: transparent;"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="summaryContent" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-top: 10px;">
                    <!-- Populated dynamically -->
                </div>
            </aside>

            <!-- Floating Search Bar Container -->
            <div id="searchBarContainer" style="display: none; position: fixed; top: 85px; right: 24px; z-index: 99; background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 16px; padding: 10px 16px; align-items: center; gap: 10px; box-shadow: var(--shadow-soft);">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--muted); font-size: 14px;"></i>
                <input type="text" id="searchInput" placeholder="Cari kata kunci..." style="border: none; background: transparent; outline: none; font-size: 13.5px; width: 160px; color: var(--text);" />
                <span id="searchResultCount" style="font-size: 11px; font-weight: 800; color: var(--muted); min-width: 40px; text-align: center;">0/0</span>
                <button class="setting-btn" id="btnPrevSearch" style="padding: 6px 10px; border-radius: 8px;" title="Sebelumnya"><i class="fa-solid fa-chevron-up"></i></button>
                <button class="setting-btn" id="btnNextSearch" style="padding: 6px 10px; border-radius: 8px;" title="Berikutnya"><i class="fa-solid fa-chevron-down"></i></button>
                <button class="setting-btn" id="btnCloseSearch" style="padding: 6px 10px; border-radius: 8px; border-color: transparent; background: transparent;" title="Tutup"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Paragraph Action Popover -->
            <div id="paragraphActionPopover" style="display: none; position: absolute; z-index: 1000; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 6px; box-shadow: var(--shadow-soft); backdrop-filter: blur(20px); gap: 4px;">
                <button class="setting-btn" id="popoverBtnHighlight" style="font-size: 11px; padding: 6px 10px; border-radius: 8px; border-color: transparent;"><i class="fa-solid fa-highlighter" style="color: #eab308; margin-right: 4px;"></i> Stabilo</button>
                <button class="setting-btn" id="popoverBtnPin" style="font-size: 11px; padding: 6px 10px; border-radius: 8px; border-color: transparent;"><i class="fa-solid fa-thumbtack" style="color: var(--blue); margin-right: 4px;"></i> Sematkan</button>
            </div>

            <!-- Float Zen Mode exit button -->
            <button class="setting-btn" id="zenExitFloat" style="display: none; position: fixed; top: 20px; right: 20px; z-index: 10000; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-color: var(--border);"><i class="fa-solid fa-eye" style="margin-right:6px;"></i> Keluar Fokus</button>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="toast" id="toast"></div>

    <!-- SCRIPT DEPS -->
    <script src="auth-helper.js"></script>
    <script src="sound-engine.js"></script>
    <script src="book-data.js"></script>
    <script>
        // Immersive Focus E-Book Reader Logic
        (function() {
            // Helpers
            const storage = {
                get(key, fallback) {
                    try {
                        return JSON.parse(localStorage.getItem(key)) ?? fallback;
                    } catch {
                        return fallback;
                    }
                },
                set(key, value) {
                    localStorage.setItem(key, JSON.stringify(value));
                }
            };

            function showToast(message) {
                const toast = document.getElementById("toast");
                if (!toast) return;
                toast.textContent = message;
                toast.classList.add("show");
                clearTimeout(showToast.timer);
                showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
            }

            // Get URL params
            const urlParams = new URLSearchParams(window.location.search);
            const bookId = urlParams.get("book");

            if (!bookId || typeof BOOKS === "undefined") {
                alert("Buku tidak valid atau database tidak termuat.");
                window.location.href = "library.html";
                return;
            }

            // State
            const activeBook = BOOKS.find(b => b.id === bookId);
            if (!activeBook) {
                alert("Buku tidak ditemukan di perpustakaan.");
                window.location.href = "library.html";
                return;
            }

            // Load saved settings
            let bookmarks = storage.get("library_bookmarks", {});
            let activeChapterIndex = bookmarks[bookId] !== undefined ? bookmarks[bookId] : 0;
            
            // Check bounds
            if (activeChapterIndex < 0 || activeChapterIndex >= activeBook.chapters.length) {
                activeChapterIndex = 0;
            }

            let readerFontSize = storage.get("library_reader_font_size", "medium"); // small, medium, large
            let readerTheme = storage.get("library_reader_theme", "light"); // light, sepia, dark
            let highlighterActive = false;
            let isPlayingTTS = false;
            let ttsUtterance = null;

            // 5 new updates state variables
            let searchMatches = [];
            let activeMatchIndex = -1;
            let isZenMode = false;

            // DOM elements
            const el = {
                backToLibrary: document.getElementById("backToLibrary"),
                toggleSidebar: document.getElementById("toggleSidebar"),
                headerCategory: document.getElementById("headerCategory"),
                headerBookTitle: document.getElementById("headerBookTitle"),
                readerSidebar: document.getElementById("readerSidebar"),
                sidebarChapterList: document.getElementById("sidebarChapterList"),
                readingSheet: document.getElementById("readingSheet"),
                readerMainContent: document.getElementById("readerMainContent"),
                
                readerFontDec: document.getElementById("readerFontDec"),
                readerFontInc: document.getElementById("readerFontInc"),
                fullscreenToggle: document.getElementById("fullscreenToggle"),
                
                btnPrevChapter: document.getElementById("btnPrevChapter"),
                btnNextChapter: document.getElementById("btnNextChapter"),
                footerProgressPercent: document.getElementById("footerProgressPercent"),
                footerProgressPages: document.getElementById("footerProgressPages"),
                
                toggleNotes: document.getElementById("toggleNotes"),
                readerNotesSidebar: document.getElementById("readerNotesSidebar"),
                readerAutosaveStatus: document.getElementById("readerAutosaveStatus"),
                readerNoteArea: document.getElementById("readerNoteArea"),
                ttsToggle: document.getElementById("ttsToggle"),
                highlighterToggle: document.getElementById("highlighterToggle"),
                searchToggle: document.getElementById("searchToggle"),
                summaryToggle: document.getElementById("summaryToggle"),
                zenToggle: document.getElementById("zenToggle")
            };

            // Audio Synthetic feedback helper
            function playSoundFx(type) {
                if (window.playSound) {
                    window.playSound(type);
                }
            }

            // Page Renderers
            function applyFontSize() {
                el.readingSheet.className = `reading-sheet font-size-${readerFontSize}`;
                storage.set("library_reader_font_size", readerFontSize);
            }

            function applyReadingTheme() {
                // Apply theme to body
                document.body.className = `read-theme-${readerTheme}`;
                
                // Toggle active states on theme buttons
                document.querySelectorAll("[data-read-theme]").forEach(btn => {
                    btn.classList.toggle("active", btn.dataset.readTheme === readerTheme);
                });
                
                storage.set("library_reader_theme", readerTheme);
            }

            function renderSidebarChapters() {
                el.sidebarChapterList.innerHTML = activeBook.chapters.map((ch, idx) => {
                    const isActive = idx === activeChapterIndex;
                    return `
                        <div class="chapter-item ${isActive ? 'active' : ''}" data-idx="${idx}">
                            ${ch.title}
                        </div>
                    `;
                }).join("");

                // Add click listeners to sidebar items
                el.sidebarChapterList.querySelectorAll(".chapter-item").forEach(item => {
                    item.addEventListener("click", () => {
                        const targetIdx = parseInt(item.dataset.idx);
                        if (targetIdx === activeChapterIndex) return;
                        changeChapter(targetIdx);
                    });
                });
            }

            function getChapterHighlights() {
                const key = `library_highlights_${bookId}_${activeChapterIndex}`;
                return storage.get(key, []);
            }

            function saveChapterHighlights(highlights) {
                const key = `library_highlights_${bookId}_${activeChapterIndex}`;
                storage.set(key, highlights);
            }

            function applyChapterHighlights() {
                const currentHighlights = getChapterHighlights();
                const paragraphs = el.readingSheet.querySelectorAll("p");
                paragraphs.forEach((p, idx) => {
                    if (p.closest(".mini-quiz-card")) return;
                    
                    p.dataset.paraIdx = idx;
                    if (currentHighlights.includes(idx)) {
                        p.classList.add("highlighted");
                    }
                    p.addEventListener("click", (e) => {
                        if (!highlighterActive) return;
                        
                        const popover = document.getElementById("paragraphActionPopover");
                        if (popover) {
                            popover.style.display = "flex";
                            popover.style.left = `${e.pageX}px`;
                            popover.style.top = `${e.pageY - 50}px`;
                            
                            document.getElementById("popoverBtnHighlight").onclick = (ev) => {
                                ev.stopPropagation();
                                p.classList.toggle("highlighted");
                                const isHighlighted = p.classList.contains("highlighted");
                                let highlights = getChapterHighlights();
                                if (isHighlighted) {
                                    if (!highlights.includes(idx)) highlights.push(idx);
                                } else {
                                    highlights = highlights.filter(i => i !== idx);
                                }
                                saveChapterHighlights(highlights);
                                playSoundFx("click");
                                popover.style.display = "none";
                            };
                            
                            document.getElementById("popoverBtnPin").onclick = (ev) => {
                                ev.stopPropagation();
                                pinQuoteToNotes(p.textContent.trim());
                                popover.style.display = "none";
                            };
                            
                            e.stopPropagation();
                        }
                    });
                });
            }

            // 1. Scroll Progress Bar & Sisa Waktu Baca
            function updateScrollProgress() {
                const contentArea = el.readerMainContent;
                if (!contentArea) return;
                const scrollHeight = contentArea.scrollHeight - contentArea.clientHeight;
                if (scrollHeight <= 0) {
                    const progressBar = document.getElementById("scrollProgressBar");
                    if (progressBar) progressBar.style.width = "0%";
                    const timeBadge = document.getElementById("readerTimeRemainingBadge");
                    if (timeBadge) timeBadge.textContent = `?? Sisa 0 menit`;
                    return;
                }
                const scrollTop = contentArea.scrollTop;
                const scrollPercent = (scrollTop / scrollHeight) * 100;
                
                const progressBar = document.getElementById("scrollProgressBar");
                if (progressBar) {
                    progressBar.style.width = `${scrollPercent}%`;
                }

                const textToRead = getCleanReadingText();
                const totalWords = textToRead.split(/\s+/).length;
                const percentRemaining = (100 - scrollPercent) / 100;
                const wordsRemaining = Math.ceil(totalWords * percentRemaining);
                const minutesRemaining = Math.max(0, Math.ceil(wordsRemaining / 200));

                const timeBadge = document.getElementById("readerTimeRemainingBadge");
                if (timeBadge) {
                    timeBadge.textContent = `?? Sisa ${minutesRemaining} menit`;
                }
            }

            // 2. In-Page Keyword Search
            function highlightSearchQuery(query) {
                removeSearchHighlights();

                if (!query || query.trim().length < 2) {
                    updateSearchResultCount(0, 0);
                    return;
                }

                const cleanQuery = query.trim();
                const regex = new RegExp(`(${escapeRegExp(cleanQuery)})`, "gi");
                
                searchMatches = [];
                activeMatchIndex = -1;
                
                const walk = (node) => {
                    if (node.nodeType === Node.TEXT_NODE) {
                        if (node.parentNode && node.parentNode.closest(".mini-quiz-card")) return;
                        if (node.parentNode && node.parentNode.closest("script")) return;
                        if (node.parentNode && node.parentNode.closest("style")) return;
                        
                        const val = node.nodeValue;
                        if (val.match(regex)) {
                            const span = document.createElement("span");
                            span.innerHTML = val.replace(regex, `<mark class="search-highlight">$1</mark>`);
                            node.parentNode.replaceChild(span, node);
                            
                            span.querySelectorAll("mark").forEach(mark => {
                                searchMatches.push(mark);
                            });
                        }
                    } else {
                        if (node.nodeName === "MARK" || node.nodeName === "SCRIPT" || node.nodeName === "STYLE" || node.id === "searchBarContainer") return;
                        const children = Array.from(node.childNodes);
                        children.forEach(child => walk(child));
                    }
                };

                walk(el.readingSheet);

                if (searchMatches.length > 0) {
                    activeMatchIndex = 0;
                    scrollToMatch(activeMatchIndex);
                }
                updateSearchResultCount(searchMatches.length > 0 ? activeMatchIndex + 1 : 0, searchMatches.length);
            }

            function removeSearchHighlights() {
                const marks = el.readingSheet.querySelectorAll("mark.search-highlight");
                marks.forEach(mark => {
                    const textNode = document.createTextNode(mark.textContent);
                    mark.parentNode.replaceChild(textNode, mark);
                });
                el.readingSheet.normalize();
                searchMatches = [];
                activeMatchIndex = -1;
            }

            function escapeRegExp(string) {
                return string.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function updateSearchResultCount(current, total) {
                const countEl = document.getElementById("searchResultCount");
                if (countEl) {
                    countEl.textContent = total === 0 ? "0/0" : `${current}/${total}`;
                }
            }

            function scrollToMatch(index) {
                if (index < 0 || index >= searchMatches.length) return;
                
                searchMatches.forEach(m => m.classList.remove("active-match"));
                
                const activeMatch = searchMatches[index];
                activeMatch.classList.add("active-match");
                activeMatch.scrollIntoView({ behavior: "smooth", block: "center" });
            }

            // 3. Sematkan Kutipan ke Catatan (Pin Quote)
            function pinQuoteToNotes(text) {
                if (!el.readerNoteArea) return;
                
                const quoteBlock = `\n\n> "${text}"\n\n`;
                el.readerNoteArea.value += quoteBlock;
                
                saveBookNote(true);
                showToast("Kutipan disematkan ke Catatan Belajar! ??");
                playSoundFx("success");
                
                if (el.readerNotesSidebar.classList.contains("collapsed")) {
                    el.readerNotesSidebar.classList.remove("collapsed");
                    el.toggleNotes.classList.add("active");
                }
            }

            // 4. Rangkuman Cepat Bab (AI Cheat Sheet)
            function generateSummary() {
                const chapter = activeBook.chapters[activeChapterIndex];
                if (!chapter) return;

                const summaryContainer = document.getElementById("summaryContent");
                if (!summaryContainer) return;

                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = chapter.content;

                const headings = tempDiv.querySelectorAll("h2, h3");
                let summaryHtml = "";

                if (headings.length === 0) {
                    summaryHtml = `<p style="font-size: 13px; color: var(--muted); font-weight: 500; text-align: center; margin-top: 20px;">Tidak ada rangkuman otomatis untuk bab ini.</p>`;
                } else {
                    headings.forEach((heading, idx) => {
                        const nextEl = heading.nextElementSibling;
                        let snippet = "";
                        if (nextEl && nextEl.tagName === "P") {
                            snippet = nextEl.textContent.substring(0, 120) + "...";
                        } else if (nextEl && (nextEl.tagName === "UL" || nextEl.tagName === "OL")) {
                            snippet = Array.from(nextEl.querySelectorAll("li")).slice(0, 2).map(li => `? ${li.textContent}`).join("<br/>");
                        }
                        
                        summaryHtml += `
                            <div style="background: rgba(102, 112, 133, 0.03); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: white; font-size: 11px; font-weight: 850;">${idx + 1}</span>
                                    <span style="font-weight: 800; font-size: 13.5px; color: var(--text);">${heading.textContent}</span>
                                </div>
                                ${snippet ? `<p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); font-weight: 500;">${snippet}</p>` : ""}
                            </div>
                        `;
                    });
                }

                summaryContainer.innerHTML = summaryHtml;
            }

            // 5. Mode Fokus (Zen Mode)
            function toggleZenMode() {
                isZenMode = !isZenMode;
                document.body.classList.toggle("zen-active", isZenMode);
                
                const zenBtn = el.zenToggle;
                const exitBtn = document.getElementById("zenExitFloat");
                
                if (zenBtn) {
                    zenBtn.classList.toggle("active", isZenMode);
                    const icon = zenBtn.querySelector("i");
                    const span = zenBtn.querySelector("span");
                    if (isZenMode) {
                        if (icon) icon.className = "fa-solid fa-eye";
                        if (span) span.textContent = "Biasa";
                    } else {
                        if (icon) icon.className = "fa-solid fa-eye-slash";
                        if (span) span.textContent = "Fokus";
                    }
                }
                
                if (exitBtn) {
                    exitBtn.style.display = isZenMode ? "block" : "none";
                }

                if (isZenMode) {
                    showToast("Mode Fokus aktif. Tekan ESC untuk keluar.");
                    el.readerSidebar.classList.add("collapsed");
                    el.readerNotesSidebar.classList.add("collapsed");
                    if (el.toggleNotes) el.toggleNotes.classList.remove("active");
                    const summaryDrawer = document.getElementById("summaryDrawer");
                    if (summaryDrawer) summaryDrawer.classList.add("collapsed");
                } else {
                    showToast("Kembali ke mode biasa.");
                }
                playSoundFx("click");
            }

            function getCleanReadingText() {
                const elements = el.readingSheet.querySelectorAll("h2, h3, p, li");
                let textParts = [];
                elements.forEach(element => {
                    if (element.closest(".mini-quiz-card")) return;
                    textParts.push(element.textContent.trim());
                });
                return textParts.join(". ");
            }

            function speakCurrentChapter() {
                if (isPlayingTTS) {
                    stopTTS();
                    return;
                }

                const textToRead = getCleanReadingText();
                if (!textToRead) {
                    showToast("Tidak ada teks untuk dibaca.");
                    return;
                }

                window.speechSynthesis.cancel();

                ttsUtterance = new SpeechSynthesisUtterance(textToRead);

                const englishCategories = ['CS', 'Database', 'Security', 'Literature', 'Web'];
                const isEnglish = englishCategories.includes(activeBook.category);
                ttsUtterance.lang = isEnglish ? 'en-US' : 'id-ID';

                const voices = window.speechSynthesis.getVoices();
                let matchingVoice = voices.find(v => v.lang.startsWith(ttsUtterance.lang));
                if (matchingVoice) {
                    ttsUtterance.voice = matchingVoice;
                }

                ttsUtterance.onend = () => {
                    stopTTS();
                };

                ttsUtterance.onerror = (e) => {
                    console.error("TTS error:", e);
                    stopTTS();
                };

                window.speechSynthesis.speak(ttsUtterance);
                isPlayingTTS = true;
                updateTTSButton();
                playSoundFx("click");
            }

            function stopTTS() {
                window.speechSynthesis.cancel();
                isPlayingTTS = false;
                updateTTSButton();
            }

            function updateTTSButton() {
                const btn = el.ttsToggle;
                if (!btn) return;
                const icon = btn.querySelector("i");
                const span = btn.querySelector("span");
                if (isPlayingTTS) {
                    btn.classList.add("active");
                    if (icon) icon.className = "fa-solid fa-square-stop";
                    if (span) span.textContent = "Hentikan";
                } else {
                    btn.classList.remove("active");
                    if (icon) icon.className = "fa-solid fa-volume-high";
                    if (span) span.textContent = "Dengar";
                }
            }

            function renderMiniQuiz() {
                const chapter = activeBook.chapters[activeChapterIndex];
                if (!chapter || !chapter.quiz) return;

                const quizKey = `library_quiz_${bookId}_${activeChapterIndex}`;
                const savedAnswer = storage.get(quizKey, null);

                const quizCard = document.createElement("div");
                quizCard.className = "mini-quiz-card";
                quizCard.id = "miniQuizCard";
                
                const isCorrect = savedAnswer !== null ? (parseInt(savedAnswer) === chapter.quiz.correct) : false;

                let optionsHtml = chapter.quiz.options.map((opt, oIdx) => {
                    let btnClass = "quiz-option-btn";
                    let disabledAttr = "";
                    let iconHtml = `<i class="fa-regular fa-circle"></i>`;
                    
                    if (savedAnswer !== null) {
                        disabledAttr = "disabled";
                        const savedIdx = parseInt(savedAnswer);
                        if (oIdx === chapter.quiz.correct) {
                            btnClass += " correct";
                            iconHtml = `<i class="fa-solid fa-circle-check"></i>`;
                        } else if (oIdx === savedIdx) {
                            btnClass += " wrong";
                            iconHtml = `<i class="fa-solid fa-circle-xmark"></i>`;
                        }
                    }

                    return `
                        <button class="${btnClass}" ${disabledAttr} data-oidx="${oIdx}" style="width: 100%;">
                            ${iconHtml}
                            <span>${opt}</span>
                        </button>
                    `;
                }).join("");

                quizCard.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                        <i class="fa-solid fa-circle-question" style="color: var(--blue); font-size: 20px;"></i>
                        <span style="font-weight: 850; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);">Kuis Cepat Pemahaman</span>
                    </div>
                    <h3 style="margin: 0 0 20px 0; font-size: 16px; font-weight: 750; line-height: 1.5;">${chapter.quiz.question}</h3>
                    <div style="display: flex; flex-direction: column; gap: 10px;" id="quizOptionsContainer">
                        ${optionsHtml}
                    </div>
                    <div id="quizExplanationBox" style="margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border); display: ${savedAnswer !== null ? 'block' : 'none'};">
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                            <span style="font-size: 14px; font-weight: 800; color: ${isCorrect ? 'var(--green)' : 'var(--danger)'};">
                                ${isCorrect ? '<i class="fa-solid fa-circle-check"></i> Jawaban Anda Benar!' : '<i class="fa-solid fa-circle-xmark"></i> Jawaban Kurang Tepat'}
                            </span>
                        </div>
                        <p style="font-size: 13.5px; line-height: 1.6; margin: 0; color: var(--text); font-weight: 500;">
                            <strong>Penjelasan:</strong> ${chapter.quiz.explanation}
                        </p>
                    </div>
                `;

                el.readingSheet.appendChild(quizCard);

                if (savedAnswer === null) {
                    const btns = quizCard.querySelectorAll(".quiz-option-btn");
                    btns.forEach(btn => {
                        btn.addEventListener("click", () => {
                            const chosenIdx = parseInt(btn.dataset.oidx);
                            storage.set(quizKey, chosenIdx);
                            
                            const isAnsCorrect = chosenIdx === chapter.quiz.correct;
                            if (isAnsCorrect) {
                                playSoundFx("success");
                            } else {
                                playSoundFx("alarm");
                            }

                            renderMiniQuizContainer();
                        });
                        
                        btn.addEventListener("mouseenter", () => {
                            playSoundFx("hover");
                        });
                    });
                }
            }

            function renderMiniQuizContainer() {
                const existingCard = document.getElementById("miniQuizCard");
                if (existingCard) {
                    existingCard.remove();
                }
                renderMiniQuiz();
            }

            function loadChapterContent() {
                const chapter = activeBook.chapters[activeChapterIndex];
                if (!chapter) return;

                // Animate fade-out first
                el.readingSheet.classList.add("fade-out");
                el.readingSheet.classList.remove("fade-in");

                setTimeout(() => {
                    el.readingSheet.innerHTML = chapter.content;
                    
                    // Apply Stabilo highlights
                    applyChapterHighlights();

                    // Render quick understanding quiz
                    renderMiniQuiz();

                    // Restore search highlights if search is open
                    const searchBar = document.getElementById("searchBarContainer");
                    if (searchBar && searchBar.style.display === "flex") {
                        const q = document.getElementById("searchInput").value;
                        if (q) highlightSearchQuery(q);
                    }

                    // Reset scroll to top of main area
                    el.readerMainContent.scrollTop = 0;
                    
                    // Trigger scroll progress bar calculations
                    updateScrollProgress();

                    // Generate summaries
                    generateSummary();

                    // Animate fade-in
                    el.readingSheet.classList.remove("fade-out");
                    el.readingSheet.classList.add("fade-in");
                }, 150);

                // Progress Update
                const progressPercent = Math.round(((activeChapterIndex + 1) / activeBook.chapters.length) * 100);
                el.footerProgressPercent.textContent = `Progress: ${progressPercent}% dibaca`;
                el.footerProgressPages.textContent = `Bab ${activeChapterIndex + 1} dari ${activeBook.chapters.length}`;

                // Prev button status
                el.btnPrevChapter.disabled = activeChapterIndex === 0;
                
                // Next button visual
                if (activeChapterIndex === activeBook.chapters.length - 1) {
                    el.btnNextChapter.innerHTML = 'Selesai Membaca <i class="fa-solid fa-check" style="margin-left:4px;"></i>';
                    el.btnNextChapter.style.background = "linear-gradient(135deg, var(--green), var(--blue))";
                } else {
                    el.btnNextChapter.innerHTML = 'Bab Berikutnya <i class="fa-solid fa-chevron-right" style="margin-left:4px;"></i>';
                    el.btnNextChapter.style.background = "var(--blue)";
                }
            }

            function changeChapter(idx) {
                stopTTS();
                removeSearchHighlights(); // Clean up search matches
                activeChapterIndex = idx;
                
                // Save progress bookmark
                bookmarks[bookId] = activeChapterIndex;
                storage.set("library_bookmarks", bookmarks);

                renderSidebarChapters();
                loadChapterContent();
                playSoundFx("click");
            }

            // Fullscreen trigger helper
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn(`Error attempting to enable full-screen mode: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            }

            // Init listeners
            function initListeners() {
                // Back to library
                el.backToLibrary.addEventListener("click", () => {
                    stopTTS();
                    playSoundFx("click");
                    window.location.href = "library.html";
                });

                // Toggle Sidebar (Collapsible)
                el.toggleSidebar.addEventListener("click", () => {
                    playSoundFx("click");
                    el.readerSidebar.classList.toggle("collapsed");
                });

                // Toggle highlighter mode
                if (el.highlighterToggle) {
                    el.highlighterToggle.addEventListener("click", () => {
                        highlighterActive = !highlighterActive;
                        el.highlighterToggle.classList.toggle("active", highlighterActive);
                        el.readerMainContent.classList.toggle("highlighter-active", highlighterActive);
                        
                        if (highlighterActive) {
                            showToast("Mode Stabilo aktif! Klik paragraf untuk menandai.");
                            playSoundFx("click");
                        } else {
                            showToast("Mode Stabilo dinonaktifkan.");
                            playSoundFx("click");
                            const popover = document.getElementById("paragraphActionPopover");
                            if (popover) popover.style.display = "none";
                        }
                    });
                }

                // Toggle TTS mode
                if (el.ttsToggle) {
                    el.ttsToggle.addEventListener("click", () => {
                        speakCurrentChapter();
                    });
                }

                window.addEventListener("beforeunload", () => {
                    stopTTS();
                });

                // Font modifier size buttons
                el.readerFontDec.addEventListener("click", () => {
                    if (readerFontSize === "large") readerFontSize = "medium";
                    else if (readerFontSize === "medium") readerFontSize = "small";
                    applyFontSize();
                    playSoundFx("click");
                });

                el.readerFontInc.addEventListener("click", () => {
                    if (readerFontSize === "small") readerFontSize = "medium";
                    else if (readerFontSize === "medium") readerFontSize = "large";
                    applyFontSize();
                    playSoundFx("click");
                });

                // Theme choices selectors
                document.querySelectorAll("[data-read-theme]").forEach(btn => {
                    btn.addEventListener("click", () => {
                        readerTheme = btn.dataset.readTheme;
                        applyReadingTheme();
                        playSoundFx("click");
                    });
                });

                // Fullscreen toggle button
                el.fullscreenToggle.addEventListener("click", () => {
                    toggleFullscreen();
                    playSoundFx("click");
                });

                // Navigation buttons
                el.btnPrevChapter.addEventListener("click", () => {
                    if (activeChapterIndex > 0) {
                        changeChapter(activeChapterIndex - 1);
                    }
                });

                el.btnNextChapter.addEventListener("click", () => {
                    if (activeChapterIndex < activeBook.chapters.length - 1) {
                        changeChapter(activeChapterIndex + 1);
                    } else {
                        // Book read fully finished
                        showToast("Hebat! Anda telah menyelesaikan seluruh bab buku ini. ??");
                        playSoundFx("success");
                        setTimeout(() => {
                            window.location.href = "library.html";
                        }, 1800);
                    }
                });

                // Listening to keyboard controls (Arrow keys & Esc/F)
                document.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowRight" && activeChapterIndex < activeBook.chapters.length - 1) {
                        changeChapter(activeChapterIndex + 1);
                    } else if (e.key === "ArrowLeft" && activeChapterIndex > 0) {
                        changeChapter(activeChapterIndex - 1);
                    } else if (e.key === "Escape" && isZenMode) {
                        toggleZenMode();
                    }
                });

                // Sync fullscreen icons
                document.addEventListener("fullscreenchange", () => {
                    const icon = el.fullscreenToggle.querySelector("i");
                    if (document.fullscreenElement) {
                        icon.className = "fa-solid fa-compress";
                    } else {
                        icon.className = "fa-solid fa-expand";
                    }
                });

                // Toggle Notes Sidebar
                if (el.toggleNotes && el.readerNotesSidebar) {
                    el.toggleNotes.addEventListener("click", () => {
                        playSoundFx("click");
                        el.readerNotesSidebar.classList.toggle("collapsed");
                        el.toggleNotes.classList.toggle("active");
                        
                        const drawer = document.getElementById("summaryDrawer");
                        if (drawer && !drawer.classList.contains("collapsed")) {
                            drawer.classList.add("collapsed");
                            el.summaryToggle.classList.remove("active");
                        }
                    });
                }

                // 1. Scroll progress listener
                if (el.readerMainContent) {
                    el.readerMainContent.addEventListener("scroll", updateScrollProgress);
                }

                // 2. Keyword Search Controls
                if (el.searchToggle) {
                    el.searchToggle.addEventListener("click", () => {
                        const searchBar = document.getElementById("searchBarContainer");
                        if (searchBar.style.display === "flex") {
                            searchBar.style.display = "none";
                            el.searchToggle.classList.remove("active");
                            removeSearchHighlights();
                        } else {
                            searchBar.style.display = "flex";
                            el.searchToggle.classList.add("active");
                            const sInput = document.getElementById("searchInput");
                            if (sInput) sInput.focus();
                        }
                        playSoundFx("click");
                    });
                }

                const sInput = document.getElementById("searchInput");
                if (sInput) {
                    sInput.addEventListener("input", (e) => {
                        highlightSearchQuery(e.target.value);
                    });
                    sInput.addEventListener("keydown", (e) => {
                        if (e.key === "Enter") {
                            e.preventDefault();
                            if (searchMatches.length > 0) {
                                activeMatchIndex = (activeMatchIndex + 1) % searchMatches.length;
                                scrollToMatch(activeMatchIndex);
                                updateSearchResultCount(activeMatchIndex + 1, searchMatches.length);
                            }
                        }
                    });
                }

                document.getElementById("btnNextSearch").addEventListener("click", () => {
                    if (searchMatches.length > 0) {
                        activeMatchIndex = (activeMatchIndex + 1) % searchMatches.length;
                        scrollToMatch(activeMatchIndex);
                        updateSearchResultCount(activeMatchIndex + 1, searchMatches.length);
                        playSoundFx("click");
                    }
                });

                document.getElementById("btnPrevSearch").addEventListener("click", () => {
                    if (searchMatches.length > 0) {
                        activeMatchIndex = (activeMatchIndex - 1 + searchMatches.length) % searchMatches.length;
                        scrollToMatch(activeMatchIndex);
                        updateSearchResultCount(activeMatchIndex + 1, searchMatches.length);
                        playSoundFx("click");
                    }
                });

                document.getElementById("btnCloseSearch").addEventListener("click", () => {
                    const searchBar = document.getElementById("searchBarContainer");
                    searchBar.style.display = "none";
                    el.searchToggle.classList.remove("active");
                    removeSearchHighlights();
                    playSoundFx("click");
                });

                // 3. Close popover on document clicks
                document.addEventListener("click", () => {
                    const popover = document.getElementById("paragraphActionPopover");
                    if (popover) popover.style.display = "none";
                });

                // 4. Summary Drawer Drawer Controls
                if (el.summaryToggle) {
                    el.summaryToggle.addEventListener("click", () => {
                        const drawer = document.getElementById("summaryDrawer");
                        drawer.classList.toggle("collapsed");
                        el.summaryToggle.classList.toggle("active");
                        
                        if (!drawer.classList.contains("collapsed")) {
                            el.readerNotesSidebar.classList.add("collapsed");
                            el.toggleNotes.classList.remove("active");
                        }
                        playSoundFx("click");
                    });
                }

                document.getElementById("btnCloseSummary").addEventListener("click", () => {
                    const drawer = document.getElementById("summaryDrawer");
                    drawer.classList.add("collapsed");
                    el.summaryToggle.classList.remove("active");
                    playSoundFx("click");
                });

                // 5. Zen Mode Toggle Controls
                if (el.zenToggle) {
                    el.zenToggle.addEventListener("click", () => {
                        toggleZenMode();
                    });
                }

                const exitZenFloat = document.getElementById("zenExitFloat");
                if (exitZenFloat) {
                    exitZenFloat.addEventListener("click", () => {
                        toggleZenMode();
                    });
                }

                // Sound on hover for buttons
                document.querySelectorAll(".setting-btn, .theme-select-btn").forEach(btn => {
                    btn.addEventListener("mouseenter", () => {
                        playSoundFx("hover");
                    });
                });
            }

            // Notes handling
            let noteSaveTimeout = null;

            function loadBookNote() {
                if (!el.readerNoteArea) return;
                const noteKey = `library_note_${bookId}`;
                el.readerNoteArea.value = storage.get(noteKey, "");
            }

            function saveBookNote(isAuto = false) {
                if (!el.readerNoteArea) return;
                const noteKey = `library_note_${bookId}`;
                const content = el.readerNoteArea.value;
                storage.set(noteKey, content);

                if (isAuto) {
                    showAutosaveStatus("saved");
                } else {
                    showToast("Catatan tersimpan! ??");
                    playSoundFx("success");
                }
            }

            // Sync with stats dashboard
            function updateDashboardStats() {
                // Done on main library page
            }

            function showAutosaveStatus(state) {
                if (!el.readerAutosaveStatus) return;
                el.readerAutosaveStatus.style.opacity = "1";
                if (state === "saving") {
                    el.readerAutosaveStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin" style="color: var(--blue);"></i>`;
                } else if (state === "saved") {
                    el.readerAutosaveStatus.innerHTML = `<i class="fa-solid fa-circle-check" style="color: var(--green);"></i>`;
                    setTimeout(() => {
                        if (el.readerAutosaveStatus && el.readerAutosaveStatus.innerHTML.includes("circle-check")) {
                            el.readerAutosaveStatus.style.opacity = "0";
                        }
                    }, 1500);
                }
            }

            function initStudyNotes() {
                if (!el.readerNoteArea) return;
                
                loadBookNote();

                el.readerNoteArea.addEventListener("input", () => {
                    showAutosaveStatus("saving");
                    clearTimeout(noteSaveTimeout);
                    noteSaveTimeout = setTimeout(() => {
                        saveBookNote(true);
                    }, 600);
                });
            }

            // Load Initialization
            function init() {
                // Set metadata in Header
                el.headerBookTitle.textContent = activeBook.title;
                el.headerCategory.textContent = activeBook.categoryLabel;

                // Apply persisted sizes/themes
                applyFontSize();
                applyReadingTheme();

                // Setup Chapters Content
                renderSidebarChapters();
                loadChapterContent();

                // Setup Notes
                initStudyNotes();

                // Listeners
                initListeners();

                // Welcome sound
                setTimeout(() => {
                    playSoundFx("cyber");
                }, 500);
            }

            // Run
            init();
        })();
    </script>
</body>

</html>
